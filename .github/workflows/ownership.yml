name: Ownership regression

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile actual sources and run synthetic ownership cases
        run: python3 tests/run_ownership.py --output "$RUNNER_TEMP/jwt-ownership"
